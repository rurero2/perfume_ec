databases:
  - name: perfume_ec_db
    databaseName: perfume_ec
    user: perfume_ec
    region: singapore

services:
  - type: web
    name: perfume_ec
    env: ruby
    region: singapore
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: perfume_ec_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

